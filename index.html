<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採購法考古題練習系統</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime"
      }
    }
  </script>

  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* --- 新增徽章特效動畫 --- */
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse-slow { 100% { transform: rotate(-360deg); } }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes cosmic-aurora {
      0% { filter: hue-rotate(0deg) drop-shadow(0 0 30px #ff00ff); }
      33% { filter: hue-rotate(120deg) drop-shadow(0 0 40px #00ffff); }
      66% { filter: hue-rotate(240deg) drop-shadow(0 0 30px #ffff00); }
      100% { filter: hue-rotate(360deg) drop-shadow(0 0 30px #ff00ff); }
    }
    @keyframes cosmic-bg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .badge-float { animation: float 4s ease-in-out infinite; }
    
    /* 顏色階級定義 */
    .theme-bronze { border-color: #8B6508; box-shadow: 0 0 15px rgba(139, 101, 8, 0.4); }
    .theme-silver { border-color: #B0C4DE; box-shadow: 0 0 20px rgba(0, 191, 255, 0.6); }
    .theme-gold { border-color: #FFD700; box-shadow: 0 0 25px rgba(148, 0, 211, 0.8); }
    .theme-cosmic { 
      border: 4px solid transparent;
      background-clip: padding-box;
      animation: cosmic-aurora 4s linear infinite; 
    }
    
    /* 宇宙流光全屏特效 */
    .cosmic-screen-glow {
      position: absolute;
      inset: -50%;
      background: conic-gradient(from 0deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
      filter: blur(60px);
      opacity: 0.3;
      animation: spin-slow 10s linear infinite;
      z-index: -1;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-[#F4F1EB]">
  
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
    import { BookOpen, CheckSquare, Clock, Trophy, Home, ChevronLeft, ChevronRight, Bookmark, AlertCircle, Play, X, Star, Save, LayoutGrid } from 'https://esm.sh/lucide-react@0.344.0';

    const fallbackConfig = {
      apiKey: "AIzaSyCS9aa4aAL7Qw2rPQdnfx-zYgA575YllVw",
      authDomain: "quiz-db627.firebaseapp.com",
      projectId: "quiz-db627",
      storageBucket: "quiz-db627.firebasestorage.app",
      messagingSenderId: "613549084178",
      appId: "1:613549084178:web:5df7a4036aa586a66a92cb"
    };

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : fallbackConfig;
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : "procurement-quiz";

    const COLORS = { bg: '#F4F1EB', cardBg: '#FFFFFF', primary: '#7B929A', secondary: '#9CAE96', accent: '#C7A38B', textMain: '#4A4A4A', textMuted: '#8A8A8A', border: '#E8E6E1' };

    // ==========================================
    // 🎨 設定 10 張女神圖片網址
    // ==========================================
    const BADGE_IMAGES = {
      1: "https://lh3.googleusercontent.com/d/1Pc8y3Acr5SwZqlIhTmV9cZwrqK995pUr", // 初入遺跡的新兵
      2: "https://lh3.googleusercontent.com/d/1HbR4jOdAGyBV25UDzR7NNuPvIVy_n8ci", // 塵封卷軸的閱讀者
      3: "https://lh3.googleusercontent.com/d/1AmhWJk6a4DG9MK59JGJQbmxS-irXSoMB", // 真理碎片的掘金者
      4: "https://lh3.googleusercontent.com/d/1glcR8q2oH6VNtp4xZiTaYEXGLZY7Exj5", // 遠古密碼的研究員
      5: "https://lh3.googleusercontent.com/d/1EtDawKfQKhba7nD_TeTuTkPz-ewplV1L", // 迴避陷阱的破譯者
      6: "https://lh3.googleusercontent.com/d/1VSWhwhg_hgp0NcOPzKLa2uePF5qwBE5S", // 時間倒流的魔術師
      7: "https://lh3.googleusercontent.com/d/12oClesD0vpJpL_D-SppSVuVjQ3Xps8-U", // 考場神殿的守門員
      8: "https://lh3.googleusercontent.com/d/1qEqWs-GXfsbq2wKMCpGPjxUebxQZr5Sz", // 亙古考場的月桂冠
      9: "https://lh3.googleusercontent.com/d/1G8dgfm0dJ5p5oNFfVLFdffAJrXpUeAY7", // 全知之眼的支配者
      10: "https://lh3.googleusercontent.com/d/1-qXhxAOy-hT8ejwbb0zy9AmOuBolPmlN",// 零死角的真理之源
    };

    const ACHIEVEMENT_TIERS = [
      { id: 't1', name: '初入遺跡的新兵', level: 1, color: 'bronze', anim: 'static', textColor: 'text-[#8B6508]', threshold: { percent: 0.1, random: 1, mock: 1 } },
      { id: 't2', name: '塵封卷軸的閱讀者', level: 2, color: 'bronze', anim: 'static', textColor: 'text-[#8B6508]', threshold: { percent: 0.2, random: 2, mock: 2 } },
      { id: 't3', name: '真理碎片的掘金者', level: 3, color: 'bronze', anim: 'static', textColor: 'text-[#8B6508]', threshold: { percent: 0.3, random: 3, mock: 3 } },
      { id: 't4', name: '遠古密碼的研究員', level: 4, color: 'silver', anim: 'static', textColor: 'text-[#4682B4]', threshold: { percent: 0.4, random: 4, mock: 4 } },
      { id: 't5', name: '迴避陷阱的破譯者', level: 5, color: 'silver', anim: 'gear', textColor: 'text-[#4682B4]', threshold: { percent: 0.5, random: 5, mock: 5 } },
      { id: 't6', name: '時間倒流的魔術師', level: 6, color: 'silver', anim: 'hourglass', textColor: 'text-[#4682B4]', threshold: { percent: 0.6, random: 6, mock: 6 } },
      { id: 't7', name: '考場神殿的守門員', level: 7, color: 'gold', anim: 'holy', textColor: 'text-[#9400D3]', threshold: { percent: 0.7, random: 7, mock: 7 } },
      { id: 't8', name: '亙古考場的月桂冠', level: 8, color: 'gold', anim: 'holy', textColor: 'text-[#9400D3]', threshold: { percent: 0.8, random: 8, mock: 8 } },
      { id: 't9', name: '全知之眼的支配者', level: 9, color: 'gold', anim: 'holy', textColor: 'text-[#9400D3]', threshold: { percent: 0.9, random: 9, random_perfect: 1, mock: 9, mock_perfect: 1 } },
      { id: 't10', name: '零死角的真理之源', level: 10, color: 'cosmic', anim: 'aurora', textColor: 'text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500', threshold: { percent: 1.0, random: 10, random_perfect: 2, mock: 10, mock_perfect: 2 } },
    ];

    const PREFIXES = { tf_full: '是非題全題庫', mc_full: '選擇題全題庫', tf_random: '是非題隨堂測驗', mc_random: '選擇題隨堂測驗', mock: '模擬測驗' };

    const parseCSV = (text) => {
      const result = [];
      let row = [], inQuotes = false, cell = '';
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (inQuotes) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; } 
          else if (char === '"') { inQuotes = false; } 
          else { cell += char; }
        } else {
          if (char === '"') { inQuotes = true; } 
          else if (char === ',') { row.push(cell.trim()); cell = ''; } 
          else if (char === '\n' || char === '\r') {
            row.push(cell.trim()); result.push(row); row = []; cell = '';
            if (char === '\r' && text[i + 1] === '\n') i++; 
          } else { cell += char; }
        }
      }
      if (cell || row.length) { row.push(cell.trim()); result.push(row); }
      return result.filter(r => r.length > 1);
    };

    const shuffleArray = (array) => {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    };

    // 【防禦性設計】：加上 || 0 確保就算資料庫抓不到該欄位，也能當作 0 來計算，避免出現 NaN
    const checkEligibility = (stats, prefixKey, threshold, tfTotal, mcTotal) => {
      if (!stats) return false;
      if (prefixKey === 'tf_full') return (stats.tf_full_answered || 0) >= Math.ceil(threshold.percent * tfTotal);
      if (prefixKey === 'mc_full') return (stats.mc_full_answered || 0) >= Math.ceil(threshold.percent * mcTotal);
      if (prefixKey === 'tf_random') return ((stats.tf_random_completed || 0) >= threshold.random) && (threshold.random_perfect ? (stats.tf_random_perfect || 0) >= threshold.random_perfect : true);
      if (prefixKey === 'mc_random') return ((stats.mc_random_completed || 0) >= threshold.random) && (threshold.random_perfect ? (stats.mc_random_perfect || 0) >= threshold.random_perfect : true);
      if (prefixKey === 'mock') return ((stats.mock_completed || 0) >= threshold.mock) && (threshold.mock_perfect ? (stats.mock_perfect || 0) >= threshold.mock_perfect : true);
      return false;
    };

    // ==========================================
    // 女神徽章元件
    // ==========================================
    function GoddessBadge({ level, size = 80, isGrayscale = false, tierInfo }) {
      const imageUrl = BADGE_IMAGES[level];
      const { color, anim } = tierInfo;
      
      let containerClass = `relative flex justify-center items-center rounded-full `;
      let imgClass = `rounded-full object-cover transition-all duration-700 z-10 border-4 border-solid bg-white `;

      if (isGrayscale) {
        imgClass += ` grayscale brightness-50 border-gray-400 `;
      } else {
        if (color === 'bronze') imgClass += ` theme-bronze `;
        else if (color === 'silver') imgClass += ` theme-silver `;
        else if (color === 'gold') imgClass += ` theme-gold `;
        else if (color === 'cosmic') imgClass += ` theme-cosmic `;

        if (anim !== 'static') containerClass += ` badge-float `;
      }

      return (
        <div className={containerClass} style={{ width: size, height: size }}>
          {!isGrayscale && (
            <>
              {(anim === 'gear' || anim === 'hourglass') && (
                 <div className="absolute inset-[-10px] rounded-full border-[3px] border-dashed border-[#87CEFA] opacity-60 pointer-events-none" style={{ animation: anim === 'gear' ? 'spin-slow 6s linear infinite' : 'spin-reverse-slow 8s ease-in-out infinite' }}></div>
              )}
              {anim === 'holy' && (
                 <div className="absolute inset-[-15px] rounded-full border-2 border-[#9400D3] shadow-[0_0_20px_#FFD700] pointer-events-none" style={{ animation: 'pulse-glow 3s infinite' }}></div>
              )}
              {anim === 'aurora' && (
                 <div className="absolute inset-[-30px] rounded-full opacity-70 blur-xl pointer-events-none z-0" style={{ background: 'conic-gradient(from 0deg, #ff00ff, #00ffff, #ffff00, #ff00ff)', animation: 'spin-slow 5s linear infinite' }}></div>
              )}
            </>
          )}
          <div className={imgClass} style={{ width: '100%', height: '100%', backgroundImage: `url(${imageUrl})`, backgroundSize: 'cover', backgroundPosition: 'center' }}></div>
        </div>
      );
    }

    // ==========================================
    // 結算/解鎖畫面特效
    // ==========================================
    function CelebrationOverlay({ unlock, onClose }) {
      const { category, tier } = unlock;
      const isMaxLevel = tier.level === 10;

      return (
        <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/75 backdrop-blur-md overflow-hidden">
          {isMaxLevel && <div className="cosmic-screen-glow"></div>}

          <div className="bg-white rounded-[3rem] p-10 px-12 text-center shadow-[0_0_80px_rgba(255,255,255,0.2)] animate-pop-in relative z-10 max-w-sm mx-4 mt-16 border border-gray-100">
            <div className="absolute -top-20 left-1/2 -translate-x-1/2 flex justify-center w-full">
              <GoddessBadge level={tier.level} size={150} isGrayscale={false} tierInfo={tier} />
              
              {tier.anim !== 'static' && (
                <>
                  <Star size={32} className="absolute -top-4 -right-2 text-yellow-300 animate-pulse" fill="currentColor" />
                  <Star size={20} className="absolute bottom-10 -left-8 text-yellow-300 animate-pulse" fill="currentColor" style={{ animationDelay: '0.5s' }} />
                </>
              )}
            </div>
            
            <h2 className="text-2xl font-black mt-20 mb-2 text-gray-700">{unlock.isClaiming ? '成功獲得新身份！' : '境界突破！'}</h2>
            <p className="text-gray-500 mb-4 font-medium">{PREFIXES[category]}</p>
            <div className={`text-4xl font-black mb-8 ${tier.textColor}`}>{tier.name}</div>
            <button onClick={onClose} className="w-full py-4 rounded-full text-white font-bold text-lg hover:scale-105 transition-transform shadow-lg bg-[#7B929A]">{unlock.isClaiming ? '太棒了！' : '繼續答題'}</button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 核心 App
    // ==========================================
    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [currentView, setCurrentView] = useState('home');
      const [modalConfig, setModalConfig] = useState(null);
      
      const [tfBank, setTfBank] = useState([]);
      const [mcBank, setMcBank] = useState([]);
      
      const defaultStats = {
        tf_full_answered: 0, mc_full_answered: 0, tf_random_completed: 0, tf_random_perfect: 0,
        mc_random_completed: 0, mc_random_perfect: 0, mock_completed: 0, mock_perfect: 0
      };

      const [userProgress, setUserProgress] = useState({ tf_full: 0, mc_full: 0 });
      const [userStats, setUserStats] = useState(defaultStats);
      const [mistakes, setMistakes] = useState([]);
      const [claimedAchievements, setClaimedAchievements] = useState([]);

      const [quizConfig, setQuizConfig] = useState(null);
      const [achievementQueue, setAchievementQueue] = useState([]);

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (error) {
            console.error("Auth error:", error);
            setLoading(false);
          }
        };
        initAuth();

        const unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        const fetchQuestions = async () => {
          try {
            const tfRes = await fetch('https://docs.google.com/spreadsheets/d/1iJGGtpb7u1QCpuESmFNjyhR56ZJlHUST1fmLk3gVC6w/gviz/tq?tqx=out:csv');
            const mcRes = await fetch('https://docs.google.com/spreadsheets/d/1j1NrbzBKsrLHzNgVqpkC9abe3a7NjDwe89X-XFlOtZU/gviz/tq?tqx=out:csv');
            
            const tfText = await tfRes.text();
            const mcText = await mcRes.text();

            const parsedTf = parseCSV(tfText).slice(1);
            const parsedMc = parseCSV(mcText).slice(1);

            const formattedTf = parsedTf.map((row, index) => ({
              id: `tf_${index}`, type: 'tf', originalIndex: index,
              question: row[1] || '', answer: row[2] === 'O' ? 'O' : 'X', explanation: row[3] || '無解析',
              isMultiple: false
            })).filter(q => q.question);

            const formattedMc = parsedMc.map((row, index) => {
              const qText = row[1] || '';
              const cleanAnswer = (row[3] || '').replace(/[, ()\s]/g, '').toUpperCase();
              const isMultiple = cleanAnswer.length > 1 || qText.includes('(多選)');
              const optionsRaw = row[2] || '';
              const parsedOptions = optionsRaw.split(/(?:\(\d+\)|\d+[.．、])\s*/).filter(o => o.trim() !== '').map(o => o.trim());

              return {
                id: `mc_${index}`, type: 'mc', isMultiple, originalIndex: index,
                question: qText, options: parsedOptions, answer: cleanAnswer, explanation: row[4] || '無解析',
              };
            }).filter(q => q.question && q.options.length > 0);

            setTfBank(formattedTf);
            setMcBank(formattedMc);
          } catch (error) {
            console.error("Failed to fetch questions:", error);
          }
        };
        fetchQuestions();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);

        const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
        const mistakesColRef = collection(db, 'artifacts', appId, 'users', user.uid, 'mistakes');
        const achievementsColRef = collection(db, 'artifacts', appId, 'users', user.uid, 'achievements');

        const initProfile = async () => {
          try {
            const snap = await getDoc(userDocRef);
            if (snap.exists()) {
              const data = snap.data();
              setUserProgress(data.progress || { tf_full: 0, mc_full: 0 });
              // 【防禦性設計】：將舊資料與預設值合併，填補空缺的欄位
              setUserStats({ ...defaultStats, ...(data.stats || {}) });
            } else {
              await setDoc(userDocRef, { progress: { tf_full: 0, mc_full: 0 }, stats: defaultStats }, { merge: true });
              setUserStats(defaultStats);
            }
          } catch (err) {
            console.error("Firestore read error:", err);
          }
          setLoading(false);
        };
        initProfile();

        const unsubMistakes = onSnapshot(mistakesColRef, (snapshot) => {
          const ms = [];
          snapshot.forEach(doc => ms.push({ id: doc.id, ...doc.data() }));
          setMistakes(ms);
        }, (err) => console.error("Mistakes snapshot error:", err));

        const unsubAchievements = onSnapshot(achievementsColRef, (snapshot) => {
          const achs = [];
          snapshot.forEach(doc => achs.push(doc.id));
          setClaimedAchievements(achs);
        }, (err) => console.error("Achievements snapshot error:", err));

        return () => { unsubMistakes(); unsubAchievements(); };
      }, [user]);

      const updateStats = async (newStatsUpdates) => {
        if (!user) return;
        const updatedStats = { ...userStats, ...newStatsUpdates };
        const newlyUnlocked = [];

        Object.keys(PREFIXES).forEach(category => {
          ACHIEVEMENT_TIERS.forEach(tier => {
            const wasEligible = checkEligibility(userStats, category, tier.threshold, tfBank.length, mcBank.length);
            const isEligible = checkEligibility(updatedStats, category, tier.threshold, tfBank.length, mcBank.length);
            if (!wasEligible && isEligible) newlyUnlocked.push({ category, tier });
          });
        });

        if (newlyUnlocked.length > 0) setAchievementQueue(prev => [...prev, ...newlyUnlocked]);
        setUserStats(updatedStats);
        const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
        try { await setDoc(userDocRef, { stats: updatedStats }, { merge: true }); } catch (e) { console.error(e); }
      };

      const saveProgress = async (mode, currentIndex) => {
        if (!user) return;
        const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
        const updatedProgress = { ...userProgress, [mode]: currentIndex };
        setUserProgress(updatedProgress);
        try { await setDoc(userDocRef, { progress: updatedProgress }, { merge: true }); } catch (e) { console.error(e); }
      };

      const handleMistakeUpdate = async (question, isCorrect) => {
        if (!user) return;
        const mistakeRef = doc(db, 'artifacts', appId, 'users', user.uid, 'mistakes', question.id);
        const existing = mistakes.find(m => m.id === question.id);

        try {
          if (isCorrect) {
            if (existing) {
              const newStreak = (existing.streak || 0) + 1;
              if (newStreak >= 3) await deleteDoc(mistakeRef);
              else await updateDoc(mistakeRef, { streak: newStreak });
            }
          } else {
            await setDoc(mistakeRef, {
              question: question.question, type: question.type, 
              isMultiple: question.isMultiple || false,
              answer: question.answer,
              options: question.options || null, explanation: question.explanation,
              streak: 0, lastFailed: new Date().toISOString()
            }, { merge: true });
          }
        } catch (e) { console.error(e); }
      };

      const showModal = (title, message, type = 'alert', onConfirm = null) => {
        setModalConfig({ title, message, type, onConfirm });
      };

      const startQuiz = (mode) => {
        let questions = [], timeLimit = null, startIndex = 0;

        if (mode === 'tf_full') { questions = [...tfBank]; startIndex = userProgress.tf_full || 0; } 
        else if (mode === 'mc_full') { questions = [...mcBank]; startIndex = userProgress.mc_full || 0; } 
        else if (mode === 'tf_random') { questions = shuffleArray(tfBank).slice(0, 20); } 
        else if (mode === 'mc_random') { questions = shuffleArray(mcBank).slice(0, 20); } 
        else if (mode === 'mock') {
          questions = [...shuffleArray(tfBank).slice(0, 50), ...shuffleArray(mcBank).slice(0, 50)];
          timeLimit = 50 * 60;
        } else if (mode === 'mistakes') {
          questions = shuffleArray(mistakes).map(m => ({ ...m, isMultiple: m.isMultiple !== undefined ? m.isMultiple : (m.type === 'mc' && m.answer.length > 1) }));
        }

        if (questions.length === 0 && mode !== 'mistakes') { showModal("提示", "題庫載入中或為空，請稍後再試。"); return; }
        setQuizConfig({ mode, questions, timeLimit, startIndex });
        setCurrentView('quiz');
      };

      if (loading || tfBank.length === 0) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#F4F1EB]">
            <div className="text-center">
              <div className="w-16 h-16 border-4 border-[#7B929A] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p className="font-medium text-lg text-gray-700">載入題庫與設定中...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen relative font-sans selection:bg-[#9CAE96] selection:text-white pb-10 overflow-x-hidden bg-[#F4F1EB]">
          <header className="px-6 py-4 flex justify-between items-center max-w-4xl mx-auto relative z-10">
            <h1 className="text-2xl font-bold tracking-wider text-gray-700">採購法考古題<span className="text-[#7B929A]">練習系統</span></h1>
            <div className="flex gap-4">
              <button onClick={() => setCurrentView('home')} className="p-2 rounded-full hover:bg-black/5 transition-colors"><Home size={24} className="text-gray-700" /></button>
              <button onClick={() => setCurrentView('achievements')} className="p-2 rounded-full hover:bg-black/5 transition-colors"><Trophy size={24} className="text-[#C7A38B]" /></button>
            </div>
          </header>

          {modalConfig && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl">
                 <h3 className="text-xl font-bold mb-3 text-gray-800">{modalConfig.title}</h3>
                 <p className="text-gray-600 mb-8 leading-relaxed whitespace-pre-wrap">{modalConfig.message}</p>
                 <div className="flex justify-end gap-3">
                   {modalConfig.type === 'confirm' && <button onClick={() => setModalConfig(null)} className="px-5 py-2.5 rounded-full font-medium text-gray-500 hover:bg-gray-100 transition-colors">取消</button>}
                   <button onClick={() => { if (modalConfig.onConfirm) modalConfig.onConfirm(); setModalConfig(null); }} className="px-5 py-2.5 rounded-full font-bold text-white shadow-md hover:scale-105 transition-transform bg-[#7B929A]">確定</button>
                 </div>
              </div>
            </div>
          )}

          {achievementQueue.length > 0 && <CelebrationOverlay unlock={achievementQueue[0]} onClose={() => setAchievementQueue(prev => prev.slice(1))} />}

          <main className="max-w-5xl mx-auto px-4 relative z-0">
            {currentView === 'home' && <HomeView startQuiz={startQuiz} mistakeCount={mistakes.length} tfProgress={userProgress.tf_full} mcProgress={userProgress.mc_full} tfTotal={tfBank.length} mcTotal={mcBank.length} showModal={showModal} />}
            {currentView === 'quiz' && quizConfig && <QuizEngine config={quizConfig} onExit={() => setCurrentView('home')} updateStats={updateStats} userStats={userStats} handleMistakeUpdate={handleMistakeUpdate} saveProgress={saveProgress} mistakes={mistakes} user={user} showModal={showModal} />}
            {currentView === 'achievements' && <AchievementWall stats={userStats} claimed={claimedAchievements} showModal={showModal} tfTotal={tfBank.length} mcTotal={mcBank.length} onClaim={async (id, category, tier) => {
                  if(!user) return;
                  await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'achievements', id), { claimedAt: new Date().toISOString() });
                  setAchievementQueue(prev => [...prev, { category, tier, isClaiming: true }]);
                }} />}
          </main>
        </div>
      );
    }

    function HomeView({ startQuiz, mistakeCount, tfProgress, mcProgress, tfTotal, mcTotal, showModal }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
          <div className="bg-white rounded-[3.5rem] p-8 shadow-sm border border-[#E8E6E1] flex flex-col items-center text-center">
            <div className="w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-[#9CAE96]/20"><BookOpen size={32} className="text-[#9CAE96]" /></div>
            <h2 className="text-xl font-bold mb-2 text-gray-700">全題庫練習</h2>
            <p className="mb-6 text-sm text-gray-400">依照順序，穩紮穩打完成所有題目。</p>
            <button onClick={() => startQuiz('tf_full')} className="w-full py-4 rounded-3xl mb-3 font-medium transition-transform hover:scale-[1.02] text-white bg-[#9CAE96]">是非題 ({tfProgress}/{tfTotal})</button>
            <button onClick={() => startQuiz('mc_full')} className="w-full py-4 rounded-3xl font-medium transition-transform hover:scale-[1.02] text-white bg-[#9CAE96]">選擇題 ({mcProgress}/{mcTotal})</button>
          </div>
          <div className="bg-white rounded-[3.5rem] p-8 shadow-sm border border-[#E8E6E1] flex flex-col items-center text-center">
            <div className="w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-[#7B929A]/20"><Clock size={32} className="text-[#7B929A]" /></div>
            <h2 className="text-xl font-bold mb-2 text-gray-700">隨機 20 題練習</h2>
            <p className="mb-6 text-sm text-gray-400">打亂順序，快速檢驗學習成效。</p>
            <button onClick={() => startQuiz('tf_random')} className="w-full py-4 rounded-3xl mb-3 font-medium transition-transform hover:scale-[1.02] text-white bg-[#7B929A]">是非題隨堂測驗</button>
            <button onClick={() => startQuiz('mc_random')} className="w-full py-4 rounded-3xl font-medium transition-transform hover:scale-[1.02] text-white bg-[#7B929A]">選擇題隨堂測驗</button>
          </div>
          <div className="bg-white rounded-[3.5rem] p-8 shadow-sm border border-[#E8E6E1] flex flex-col items-center text-center md:col-span-2">
            <div className="w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-[#C7A38B]/20"><Star size={32} className="text-[#C7A38B]" /></div>
            <h2 className="text-xl font-bold mb-2 text-gray-700">全真模擬試題</h2>
            <p className="mb-6 text-sm text-gray-400">是非 50 題 + 選擇 50 題，限時 100 分鐘。</p>
            <button onClick={() => startQuiz('mock')} className="w-full max-w-md py-4 rounded-3xl font-medium transition-transform hover:scale-[1.02] text-white bg-[#C7A38B]">開始全真模擬</button>
          </div>
          <div className="bg-white rounded-[3.5rem] p-8 shadow-sm border border-[#E8E6E1] flex flex-col items-center text-center md:col-span-2">
             <div className="w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-red-50"><AlertCircle size={32} className="text-red-400" /></div>
            <h2 className="text-xl font-bold mb-2 text-gray-700">錯題強化練習</h2>
            <p className="mb-6 text-sm text-gray-400">針對曾答錯的題目進行特訓。需連續答對 3 次才能移出錯題本喔！</p>
            <button onClick={() => mistakeCount > 0 ? startQuiz('mistakes') : showModal('提示', '目前沒有錯題喔！繼續保持！')} className={`w-full max-w-md py-4 rounded-3xl font-medium transition-transform hover:scale-[1.02] ${mistakeCount > 0 ? 'bg-red-400 text-white shadow-md' : 'bg-gray-200 text-gray-500 cursor-not-allowed'}`}>進入強化庫 ({mistakeCount} 題)</button>
          </div>
        </div>
      );
    }

    function QuizEngine({ config, onExit, updateStats, userStats, handleMistakeUpdate, saveProgress, mistakes, user, showModal }) {
      const { mode, questions, timeLimit, startIndex } = config;
      const isFullMode = mode === 'tf_full' || mode === 'mc_full';
      
      const [currentIndex, setCurrentIndex] = useState(startIndex || 0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [showExplanation, setShowExplanation] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [userAnswers, setUserAnswers] = useState(new Array(questions.length).fill(null));
      const [score, setScore] = useState(0);
      const [isFinished, setIsFinished] = useState(false);
      const [timeLeft, setTimeLeft] = useState(timeLimit);
      const [mockPart, setMockPart] = useState(1);

      const currentQ = questions[currentIndex];

      useEffect(() => {
        if (userAnswers[currentIndex]) {
          setSelectedAnswer(userAnswers[currentIndex].selectedAnswer);
          setIsAnswered(true); setShowExplanation(false);
        } else {
          setSelectedAnswer(currentQ?.isMultiple ? [] : null);
          setIsAnswered(false); setShowExplanation(false);
        }
      }, [currentIndex, currentQ]);

      const isBookmarked = mistakes.some(m => m.id === currentQ?.id);
      const toggleBookmark = async () => {
        if (!user || !currentQ) return;
        const mistakeRef = doc(db, 'artifacts', appId, 'users', user.uid, 'mistakes', currentQ.id);
        if (isBookmarked) await deleteDoc(mistakeRef);
        else await setDoc(mistakeRef, { question: currentQ.question, type: currentQ.type, isMultiple: currentQ.isMultiple || false, answer: currentQ.answer, options: currentQ.options || null, explanation: currentQ.explanation, streak: 0, bookmarked: true, lastFailed: new Date().toISOString() }, { merge: true });
      };

      useEffect(() => {
        if (timeLimit === null || isFinished) return;
        const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        return () => clearInterval(timer);
      }, [timeLimit, isFinished]);

      useEffect(() => {
        if (timeLeft <= 0 && timeLimit !== null && !isFinished) {
          if (mode === 'mock' && mockPart === 1) {
            setMockPart(2); setCurrentIndex(50); setTimeLeft(timeLimit);
            showModal("時間到", "第一部分 (是非題) 時間到！系統將自動進入第二部分 (選擇題)。");
          } else {
            if (mode === 'mock') evaluateMockExam(); else finishQuiz();
          }
        }
      }, [timeLeft, isFinished, mode, mockPart, timeLimit]);

      const handleSelect = (ans) => {
        if (isAnswered && !isFullMode && mode !== 'mock') return;
        let newSelected;
        if (currentQ.isMultiple) {
          newSelected = Array.isArray(selectedAnswer) ? [...selectedAnswer] : [];
          if (newSelected.includes(ans)) newSelected = newSelected.filter(a => a !== ans);
          else { newSelected.push(ans); newSelected.sort(); }
        } else newSelected = ans;
        
        setSelectedAnswer(newSelected);

        if (mode === 'mock') {
          const newAnswers = [...userAnswers];
          newAnswers[currentIndex] = { selectedAnswer: newSelected };
          setUserAnswers(newAnswers); setIsAnswered(true);
        } else {
          if (currentQ.type === 'tf' || !currentQ.isMultiple) processSubmit(newSelected);
        }
      };

      const processSubmit = (ansToEval) => {
        const evalTarget = ansToEval || selectedAnswer;
        if (currentQ.isMultiple && (!evalTarget || evalTarget.length === 0)) return;
        if (!currentQ.isMultiple && !evalTarget) return;

        setIsAnswered(true);
        let isCorrect = false;

        if (currentQ.isMultiple) isCorrect = [...evalTarget].sort().join('') === currentQ.answer.split('').sort().join('');
        else isCorrect = evalTarget === currentQ.answer;
        
        const newAnswers = [...userAnswers];
        newAnswers[currentIndex] = { isCorrect, selectedAnswer: evalTarget };
        setUserAnswers(newAnswers);
        if (isCorrect) setScore(s => s + 1);
        handleMistakeUpdate(currentQ, isCorrect);

        if (isFullMode) {
          saveProgress(mode, currentIndex + 1);
          const statKey = mode === 'tf_full' ? 'tf_full_answered' : 'mc_full_answered';
          updateStats({ [statKey]: (userStats[statKey] || 0) + 1 });
        }
      };

      const evaluateMockExam = async () => {
        let currentScore = 0;
        const evaluatedAnswers = userAnswers.map((ansObj, idx) => {
           const q = questions[idx];
           if (!ansObj || !ansObj.selectedAnswer || ansObj.selectedAnswer.length === 0) { handleMistakeUpdate(q, false); return { isCorrect: false, selectedAnswer: null }; }
           let isCorrect = q.isMultiple ? [...ansObj.selectedAnswer].sort().join('') === q.answer.split('').sort().join('') : ansObj.selectedAnswer === q.answer;
           if (isCorrect) currentScore++;
           handleMistakeUpdate(q, isCorrect); return { isCorrect, selectedAnswer: ansObj.selectedAnswer };
        });
        setUserAnswers(evaluatedAnswers); setScore(currentScore);
        updateStats({ mock_completed: (userStats.mock_completed || 0) + 1, ...(currentScore === 100 && {mock_perfect: (userStats.mock_perfect || 0) + 1}) });
        setIsFinished(true);
      };

      const nextQuestion = () => {
        if (mode === 'mock' && mockPart === 1 && currentIndex === 49) {
          showModal("進入第二部分", "確定要結束是非題部分，進入選擇題嗎？進入後將無法修改是非題答案。", "confirm", () => {
              setMockPart(2); setCurrentIndex(50); setTimeLeft(timeLimit); setSelectedAnswer(userAnswers[50]?.selectedAnswer || null); setIsAnswered(!!userAnswers[50]); setShowExplanation(false);
          });
          return;
        }
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(c => c + 1);
          setSelectedAnswer(userAnswers[currentIndex + 1]?.selectedAnswer || null); setIsAnswered(!!userAnswers[currentIndex + 1]); setShowExplanation(false);
        } else {
          if (mode === 'mock') showModal("確認交卷", "確定要交卷嗎？未作答的題目將以 0 分計算。", "confirm", () => evaluateMockExam());
          else finishQuiz();
        }
      };

      const prevQuestion = () => {
        if (mode === 'mock' && mockPart === 2 && currentIndex === 50) return;
        if (currentIndex > 0) { setCurrentIndex(c => c - 1); setSelectedAnswer(userAnswers[currentIndex - 1]?.selectedAnswer || null); setIsAnswered(!!userAnswers[currentIndex - 1]); setShowExplanation(false); }
      };

      const jumpToQuestion = (targetIndex) => {
        if (mode === 'mock') {
          if (mockPart === 1 && targetIndex >= 50) { showModal("提示", "這部分是選擇題，請先完成是非題部分！"); return; }
          if (mockPart === 2 && targetIndex < 50) { showModal("提示", "是非題部分已結束，目前無法返回修改。"); return; }
        }
        setCurrentIndex(targetIndex);
        setSelectedAnswer(userAnswers[targetIndex]?.selectedAnswer || null); setIsAnswered(!!userAnswers[targetIndex]); setShowExplanation(false); setIsMenuOpen(false);
      };

      // 【新增】鍵盤快捷鍵監聽
      useEffect(() => {
        const handleKeyDown = (e) => {
          // 若選單開啟，或有彈出視窗(Modal)存在時，停用快捷鍵
          if (isMenuOpen || document.querySelector('.z-\\[100\\]')) return;

          const key = e.key;
          const lowerKey = key?.toLowerCase();

          if (key === 'ArrowRight' || lowerKey === 'd') {
            nextQuestion();
          } else if (key === 'ArrowLeft' || lowerKey === 'a') {
            // 避免在第一題或模擬測驗第二部分第一題往前跳
            if (currentIndex > 0 && !(mode === 'mock' && mockPart === 2 && currentIndex === 50)) {
              prevQuestion();
            }
          } else if (['1', '2', '3', '4', '5'].includes(key)) {
            if (currentQ.type === 'tf') {
              // 是非題直覺對應：1為O，2為X
              if (key === '1') handleSelect('O');
              if (key === '2') handleSelect('X');
            } else {
              // 選擇題對應1~5選項
              if (parseInt(key) <= currentQ.options.length) {
                handleSelect(key);
              }
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      });

      // 【防禦性設計】：使用 || 0 確保就算資料庫抓不到該欄位，也能當作 0 來 +1，避免出錯
      const finishQuiz = () => {
        setIsFinished(true);
        if (mode === 'tf_random') updateStats({ tf_random_completed: (userStats.tf_random_completed || 0) + 1, ...(score === 20 && {tf_random_perfect: (userStats.tf_random_perfect || 0) + 1}) });
        else if (mode === 'mc_random') updateStats({ mc_random_completed: (userStats.mc_random_completed || 0) + 1, ...(score === 20 && {mc_random_perfect: (userStats.mc_random_perfect || 0) + 1}) });
        else if (mode === 'mock') { const finalScore = userAnswers.filter(a => a && a.isCorrect).length;
        updateStats({ mock_completed: (userStats.mock_completed || 0) + 1, ...(finalScore === 100 && {mock_perfect: (userStats.mock_perfect || 0) + 1}) });
        }
      };

      const formatTime = (seconds) => { const m = Math.floor(seconds / 60);
      const s = seconds % 60; return `${m}:${s < 10 ? '0' : ''}${s}`; };

      const renderNavButton = (idx) => {
        const isAnsweredLocal = !!userAnswers[idx];
        const isCurrent = idx === currentIndex;
        let isDisabled = (mode === 'mock' && ((mockPart === 1 && idx >= 50) || (mockPart === 2 && idx < 50)));
        const displayNum = mode === 'mock' ? (idx < 50 ? idx + 1 : idx - 49) : idx + 1;

        return (
          <button key={idx} onClick={() => jumpToQuestion(idx)} disabled={isDisabled} className={`w-10 h-10 md:w-12 md:h-12 rounded-2xl flex items-center justify-center font-bold text-sm transition-all ${isDisabled ? 'opacity-30 cursor-not-allowed bg-gray-100 text-gray-400' : isCurrent ? 'ring-4 ring-offset-2 scale-110 z-10' : isAnsweredLocal ? 'hover:opacity-80' : 'bg-white shadow-sm border text-gray-500 hover:bg-gray-50'}`} style={{ backgroundColor: isAnsweredLocal && !isDisabled ? '#9CAE96' : undefined, color: isAnsweredLocal && !isDisabled ? 'white' : undefined, '--tw-ring-color': isCurrent ? '#C7A38B' : undefined }}>{displayNum}</button>
        );
      };

      if (isFinished) {
        if (mode === 'mock') {
          const totalCorrect = userAnswers.filter(a => a && a.isCorrect).length;
          return (
            <div className="bg-white rounded-[3.5rem] p-8 md:p-12 shadow-sm border border-[#E8E6E1] mt-8 max-w-5xl mx-auto">
              <h2 className="text-3xl font-bold mb-4 text-center text-gray-700">全真模擬測驗 結算報告</h2>
              <div className="text-6xl font-black mb-10 text-center text-[#7B929A]">{totalCorrect} <span className="text-2xl text-gray-400">/ 100</span></div>
              <div className="space-y-4 mb-8 h-[60vh] overflow-y-auto pr-4 scrollbar-hide">
                {questions.map((q, idx) => {
                  const ans = userAnswers[idx]; const isCorrect = ans?.isCorrect;
                  const userAnsStr = ans?.selectedAnswer && ans.selectedAnswer.length > 0 ? (Array.isArray(ans.selectedAnswer) ? ans.selectedAnswer.join('') : ans.selectedAnswer) : '未作答';
                  return (
                    <div key={idx} className={`p-6 rounded-3xl border-2 ${isCorrect ? 'bg-green-50/50 border-green-200' : 'bg-red-50/50 border-red-200'}`}>
                      <div className="flex gap-4 items-start mb-3"><span className={`w-10 h-10 flex shrink-0 items-center justify-center rounded-full font-bold text-lg text-white ${isCorrect ? 'bg-green-500' : 'bg-red-500 shadow-sm'}`}>{idx + 1}</span><h4 className="text-lg font-medium text-gray-800 leading-relaxed mt-1">{q.question}</h4></div>
                      <div className="ml-14 grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm bg-white p-4 rounded-2xl border border-gray-100 shadow-sm"><div><span className="text-gray-500 mr-2">你的答案:</span><span className={`font-bold text-lg ${isCorrect ? 'text-green-600' : 'text-red-600'}`}>{userAnsStr}</span></div><div><span className="text-gray-500 mr-2">正確答案:</span><span className="font-bold text-lg text-gray-800">{q.answer}</span></div></div>
                      {q.explanation && q.explanation !== '無解析' && (<div className="ml-14 mt-3 p-4 bg-white/60 rounded-2xl text-gray-600 text-sm border border-gray-100"><strong className="text-gray-700">解析：</strong> {q.explanation}</div>)}
                    </div>
                  )
                })}
              </div>
              <div className="text-center pt-6 border-t border-gray-100"><p className="mb-6 text-gray-400">錯題已自動加入「錯題強化練習」庫，記得回去複習喔！</p><button onClick={onExit} className="px-10 py-4 rounded-full font-bold text-white shadow-md transition-transform hover:scale-[1.05] bg-[#9CAE96]">返回首頁</button></div>
            </div>
          );
        }
        const totalCorrect = userAnswers.filter(a => a && a.isCorrect).length;
        return (
          <div className="bg-white rounded-[3.5rem] p-8 md:p-12 shadow-sm border border-[#E8E6E1] text-center mt-8">
            <Trophy size={64} className="mx-auto mb-6 text-[#C7A38B]" />
            <h2 className="text-3xl font-bold mb-4 text-gray-700">測驗完成！</h2>
            <div className="text-6xl font-black mb-6 text-[#7B929A]">{totalCorrect} <span className="text-2xl text-gray-400">/ {questions.length}</span></div>
            <p className="mb-8 text-gray-400">錯題已自動加入「錯題強化練習」庫，記得回去複習喔！</p>
            <button onClick={onExit} className="px-8 py-4 rounded-full font-bold text-white shadow-md transition-transform hover:scale-[1.05] bg-[#9CAE96]">返回首頁</button>
          </div>
        );
      }

      return (
        <div className="mt-6">
          <div className="flex flex-wrap justify-between items-center mb-6 gap-y-4 px-2">
            <div className="flex items-center gap-2">
              <span className="px-4 py-1.5 rounded-full text-sm font-medium text-white shadow-sm bg-[#7B929A]">{PREFIXES[mode] || '錯題練習'}</span>
              <span className="px-4 py-1.5 rounded-full text-sm font-medium text-white shadow-sm bg-[#9CAE96]">{mode === 'mock' ? `第 ${mockPart} 部分: ${mockPart === 1 ? '是非題' : '選擇題'} (${currentIndex + 1 - (mockPart === 1 ? 0 : 50)} / 50)` : `題號 ${currentIndex + 1} / ${questions.length}`}</span>
              <button onClick={toggleBookmark} className={`ml-1 p-1.5 rounded-full transition-colors shrink-0 shadow-sm ${isBookmarked ? 'text-yellow-500 bg-white hover:text-yellow-600' : 'text-gray-400 bg-white/50 hover:text-yellow-500 hover:bg-white'}`} title={isBookmarked ? "移除書籤" : "加入書籤 (加入錯題庫)"}><Bookmark size={20} fill={isBookmarked ? "currentColor" : "none"} /></button>
            </div>
            <div className="flex items-center gap-2 md:gap-3 ml-auto">
              {timeLimit !== null && <div className={`px-4 py-1.5 rounded-full text-sm font-bold shadow-sm ${timeLeft < 300 ? 'bg-red-500 text-white' : 'bg-gray-200 text-gray-700'}`}>剩餘: {formatTime(timeLeft)}</div>}
              <button onClick={() => setIsMenuOpen(true)} className="flex items-center gap-1 px-4 py-1.5 rounded-full text-sm font-medium border-2 bg-white hover:bg-gray-50 transition-colors shadow-sm text-gray-700"><LayoutGrid size={16} /><span className="hidden sm:inline">題號選單</span></button>
              <button onClick={() => { if(isFullMode) saveProgress(mode, currentIndex); onExit(); }} className="flex items-center gap-1 px-4 py-1.5 rounded-full text-sm font-medium border-2 hover:bg-gray-50 transition-colors bg-white shadow-sm text-[#7B929A] border-[#7B929A]"><Save size={16} /><span className="hidden sm:inline">{isFullMode ? '儲存進度並回首頁' : '中斷並回首頁'}</span></button>
            </div>
          </div>

          {isMenuOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/30 backdrop-blur-sm transition-opacity">
              <div className="absolute inset-0" onClick={() => setIsMenuOpen(false)}></div>
              <div className="w-80 md:w-96 bg-[#F4F1EB] h-full shadow-2xl p-6 overflow-y-auto animate-slide-in-right flex flex-col relative">
                <div className="flex justify-between items-center mb-6 pb-4 border-b border-[#E8E6E1]"><h3 className="text-xl font-bold text-gray-700">題目總覽 <span className="text-sm font-normal text-gray-500 ml-2">點擊跳轉</span></h3><button onClick={() => setIsMenuOpen(false)} className="p-2 bg-white rounded-full hover:bg-gray-100 shadow-sm transition-colors text-gray-600"><X size={20} /></button></div>
                <div className="flex-1 overflow-y-auto pr-2 scrollbar-hide">
                  {mode === 'mock' ? (
                    <><div className="mb-3 font-bold text-[#7B929A]">第一部分：是非題 (1-50)</div><div className="grid grid-cols-5 gap-3 mb-8">{questions.slice(0, 50).map((q, i) => renderNavButton(i))}</div><div className="mb-3 font-bold text-[#7B929A]">第二部分：選擇題 (1-50)</div><div className="grid grid-cols-5 gap-3 pb-8">{questions.slice(50, 100).map((q, i) => renderNavButton(i + 50))}</div></>
                  ) : (<div className="grid grid-cols-5 gap-3 pb-8">{questions.map((q, i) => renderNavButton(i))}</div>)}
                </div>
              </div>
            </div>
          )}

          <div className="bg-white rounded-[3.5rem] p-8 md:p-12 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-[#E8E6E1] relative min-h-[400px] flex flex-col">
            <button onClick={prevQuestion} disabled={currentIndex === 0 || (mode === 'mock' && mockPart === 2 && currentIndex === 50)} className="absolute left-[-20px] md:left-[-40px] top-1/2 -translate-y-1/2 p-3 bg-white rounded-full shadow-md border border-gray-100 disabled:opacity-30 disabled:cursor-not-allowed hover:scale-110 transition-transform text-gray-500 z-10"><ChevronLeft size={28} /></button>
            <div className="mb-10"><h3 className="text-xl md:text-2xl font-medium leading-relaxed text-gray-700">{currentQ.question}</h3></div>
            <div className="flex flex-col gap-4 mb-8">
              {currentQ.type === 'tf' ? (
                <div className="grid grid-cols-2 gap-4">
                  {['O', 'X'].map((opt) => (
                    <button key={opt} onClick={() => handleSelect(opt)} disabled={isAnswered && !isFullMode && mode !== 'mock'}
                      className={`py-6 rounded-3xl text-2xl font-bold border-2 transition-all ${selectedAnswer === opt ? mode === 'mock' ? 'bg-blue-50 border-blue-400 text-blue-600' : isAnswered ? opt === currentQ.answer ? 'bg-green-50 border-green-500 text-green-600' : 'bg-red-50 border-red-500 text-red-600' : 'bg-blue-50 border-blue-400 text-blue-600' : isAnswered && opt === currentQ.answer && mode !== 'mock' ? 'bg-green-50 border-green-500 text-green-600 opacity-50' : 'bg-white border-gray-200 text-gray-600 hover:border-gray-300'}`}>{opt}</button>
                  ))}
                </div>
              ) : (
                 currentQ.options.map((opt, idx) => {
                  const optionLabel = String(idx + 1);
                  const isSelected = currentQ.isMultiple ? Array.isArray(selectedAnswer) && selectedAnswer.includes(optionLabel) : selectedAnswer === optionLabel;
                  const isCorrectOpt = (currentQ.isMultiple ? currentQ.answer.split('') : [currentQ.answer]).includes(optionLabel);
                  let btnClass = 'bg-white border-gray-200 text-gray-700 hover:border-gray-300';

                  if (isSelected) { if (mode === 'mock') btnClass = 'bg-blue-50 border-blue-400 text-blue-700';
                  else if (!isAnswered) btnClass = 'bg-blue-50 border-blue-400 text-blue-700'; else if (isCorrectOpt) btnClass = 'bg-green-50 border-green-500 text-green-700 font-bold';
                  else btnClass = 'bg-red-50 border-red-500 text-red-700'; } 
                  else if (isAnswered && isCorrectOpt && mode !== 'mock') btnClass = 'bg-green-50 border-green-500 text-green-700 border-dashed opacity-70';

                  return (
                    <button key={idx} onClick={() => handleSelect(optionLabel)} disabled={isAnswered && !isFullMode && mode !== 'mock'} className={`flex items-center text-left p-4 md:p-5 rounded-2xl border-2 transition-all ${btnClass}`}>
                      <span className={`w-8 h-8 flex items-center justify-center mr-4 shrink-0 font-bold ${currentQ.isMultiple ? 'rounded-md' : 'rounded-full'} ${isSelected ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-500'}`}>({optionLabel})</span><span className="text-lg">{opt}</span>
                    </button>
                  );
                })
              )}
            </div>
            {mode === 'mock' ? (
              <div className="flex justify-between items-center w-full border-t pt-6 border-gray-100 mt-auto">
                <button onClick={prevQuestion} disabled={currentIndex === 0 || (mockPart === 2 && currentIndex === 50)} className="px-6 py-3 rounded-full font-bold text-gray-500 hover:bg-gray-100 transition-all disabled:opacity-30 disabled:cursor-not-allowed">上一題</button>
                <button onClick={nextQuestion} className="px-8 py-3 rounded-full text-white font-bold transition-all shadow-md flex items-center gap-2 hover:scale-105 bg-[#9CAE96]">{mockPart === 1 && currentIndex === 49 ? '進入選擇題' : currentIndex === questions.length - 1 ? '完成交卷' : '下一題'} <ChevronRight size={20} /></button>
              </div>
            ) : (!isAnswered && !currentQ.isMultiple) ? null : (
              <div className="flex flex-col md:flex-row justify-between items-center gap-4 border-t pt-6 border-gray-100 mt-auto">
                 {!isAnswered ? (
                   <button onClick={() => processSubmit(selectedAnswer)} disabled={currentQ.isMultiple ? !selectedAnswer || selectedAnswer.length === 0 : !selectedAnswer} className="w-full md:w-auto px-10 py-3 rounded-full text-white font-bold transition-all disabled:opacity-50 disabled:cursor-not-allowed bg-[#7B929A]">送出答案</button>
                 ) : (
                   <div className="flex flex-col w-full">
                     <div className="flex justify-between items-center w-full mb-4">
                       <div className="flex gap-2">
                         {userAnswers[currentIndex]?.isCorrect ? <span className="px-3 py-1 bg-green-100 text-green-700 font-bold rounded-lg">答對了！</span> : <span className="px-3 py-1 bg-red-100 text-red-700 font-bold rounded-lg">答錯囉</span>}
                         {currentQ.explanation && currentQ.explanation !== '無解析' && <button onClick={() => setShowExplanation(!showExplanation)} className="text-sm underline text-gray-500 hover:text-gray-800">{showExplanation ? '隱藏解析' : '查看解析'}</button>}
                       </div>
                       <button onClick={nextQuestion} className="px-10 py-3 rounded-full text-white font-bold transition-all hover:scale-105 shadow-md flex items-center gap-2 bg-[#9CAE96]">{currentIndex === questions.length - 1 ? '完成測驗' : '下一題'} <ChevronRight size={20} /></button>
                     </div>
                     {showExplanation && <div className="bg-gray-50 p-4 rounded-xl text-gray-700 text-sm mt-2 border border-gray-200"><strong>解析：</strong> {currentQ.explanation}</div>}
                   </div>
                 )}
              </div>
            )}
            <button onClick={nextQuestion} className="absolute right-[-20px] md:right-[-40px] top-1/2 -translate-y-1/2 p-3 bg-white rounded-full shadow-md border border-gray-100 hover:scale-110 transition-transform text-gray-500 z-10"><ChevronRight size={28} /></button>
          </div>
        </div>
      );
    }

    function AchievementWall({ stats, claimed, onClaim, showModal, tfTotal, mcTotal }) {
      return (
        <div className="mt-8 pb-12">
          <div className="text-center mb-10"><h2 className="text-3xl font-bold mb-2 text-gray-700">成就塔羅牌</h2><p className="text-gray-400">達成門檻後，點擊發光的牌陣解鎖女神神識！</p></div>
          <div className="space-y-12">
            {Object.keys(PREFIXES).map(category => (
              <div key={category} className="bg-white rounded-[3rem] p-8 shadow-sm border border-[#E8E6E1]">
                 <h3 className="text-xl font-bold mb-8 flex items-center gap-2 border-b pb-4 text-[#7B929A]"><Trophy size={20} /> {PREFIXES[category]}</h3>
                
                <div className="grid grid-cols-2 md:grid-cols-5 gap-y-10 gap-x-4">
                  {ACHIEVEMENT_TIERS.map(tier => {
                    const achieveId = `${category}_${tier.id}`;
                    const isClaimed = claimed.includes(achieveId);
                    const isEligible = checkEligibility(stats, category, tier.threshold, tfTotal, mcTotal);
                    const isClaimable = isEligible && !isClaimed;
                    
                    const handleTrophyClick = () => {
                      if (isClaimable) onClaim(achieveId, category, tier);
                      else if (!isClaimed) {
                        let reqText = "";
                        const th = tier.threshold; const prefix = PREFIXES[category];
                        if (category.includes('full')) reqText = `在「${prefix}」中，完成總題數的 ${Math.round(th.percent * 100)}% (約 ${Math.ceil(th.percent * (category === 'tf_full' ? tfTotal : mcTotal))} 題)。`;
                        else if (category.includes('random')) reqText = th.random_perfect ? `在「${prefix}」中，完成 ${th.random} 次以上測驗，且獲得滿分 ${th.random_perfect} 次。` : `在「${prefix}」中，完成 ${th.random} 次測驗。`;
                        else if (category === 'mock') reqText = th.mock_perfect ? `在「全真模擬測驗」中，完成 ${th.mock} 次以上測驗，且獲得滿分 ${th.mock_perfect} 次。` : `完成 ${th.mock} 次全真模擬測驗。`;
                        showModal(`解鎖條件：${tier.name}`, reqText);
                      } else showModal(`身份確認：${tier.name}`, "這張塔羅牌已經被你喚醒了！繼續精進實力吧！");
                    };
                    
                    let buttonClass = 'relative rounded-full flex flex-col items-center justify-center transition-all duration-300 w-full ';
                    if (isClaimed) buttonClass += ' hover:scale-110 cursor-pointer';
                    else if (isClaimable) buttonClass += ' hover:scale-110 cursor-pointer drop-shadow-[0_0_15px_rgba(255,215,0,0.8)]';
                    else buttonClass += ' opacity-60 cursor-pointer hover:opacity-100 hover:scale-105';
                    
                    return (
                      <div key={achieveId} className="flex flex-col items-center">
                        <button onClick={handleTrophyClick} className={buttonClass}>
                          <GoddessBadge level={tier.level} size={84} isGrayscale={!isClaimed} tierInfo={tier} />
                          {isClaimable && <div className="absolute -bottom-2 text-white font-bold text-xs bg-yellow-500 px-4 py-1.5 rounded-full shadow-md animate-bounce z-20 whitespace-nowrap">點擊喚醒</div>}
                        </button>
                        <div className="text-center mt-6">
                          <div className={`font-bold text-sm ${isClaimed ? tier.textColor : 'text-gray-400'}`}>{tier.name}</div>
                          <div className="text-xs text-gray-400 mt-1 whitespace-pre-wrap text-center leading-relaxed">
                             {category.includes('full') && `進度 ${Math.round(tier.threshold.percent * 100)}%\n(${Math.ceil(tier.threshold.percent * (category === 'tf_full' ? tfTotal : mcTotal))}題)`}
                             {category.includes('random') && (tier.threshold.random_perfect ? `完成 ${tier.threshold.random} 次\n滿分 ${tier.threshold.random_perfect} 次` : `完成 ${tier.threshold.random} 次`)}
                             {category === 'mock' && (tier.threshold.mock_perfect ? `完成 ${tier.threshold.mock} 次\n滿分 ${tier.threshold.mock_perfect} 次` : `完成 ${tier.threshold.mock} 次`)}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
